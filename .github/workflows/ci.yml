name: CI

# Everyday verification. The `test` branch is excluded because release.yml
# already runs the full matrix there.
on:
  push:
    branches-ignore:
      - test
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: Build
    needs: static
    # LTS lines plus the current and previous majors; release.yml covers the
    # full 18..26 span.
    uses: ./.github/workflows/build.yml
    with:
      node-versions: '[18, 20, 22, 24, 26]'
